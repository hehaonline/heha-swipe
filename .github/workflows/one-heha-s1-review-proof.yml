name: ONE HEHA S1 Review Proof

on:
  pull_request:
    branches:
      - main
    paths:
      - 'contracts/one-heha-s1-swipe-foundation-v1.json'
      - 'docs/architecture/one-heha-s1-swipe-identity-community-pass-foundation.md'
      - 'scripts/verify-capture-query-read-only.mjs'
      - 'scripts/verify-one-heha-s1-review.mjs'
      - 'scripts/verify-tracked-js-syntax.mjs'
      - 'supabase/review_only/one_heha_s1/**'
      - '.github/workflows/heha-swipe-ci.yml'
      - '.github/workflows/one-heha-s1-review-proof.yml'

permissions:
  contents: read

jobs:
  verify:
    name: PostgreSQL ${{ matrix.postgres }} review proof
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        postgres: ['15', '17']

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - name: Check out literal branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.0

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Verify exact review-only scope
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"

          git diff --no-renames --check "$base" "$head"
          mapfile -t files < <(git diff --no-renames --name-only "$base" "$head" | sort)
          printf '%s\n' "${files[@]}"

          allowed='^(\.github/workflows/(one-heha-s1-review-proof|heha-swipe-ci)\.yml|contracts/one-heha-s1-swipe-foundation-v1\.json|docs/architecture/one-heha-s1-swipe-identity-community-pass-foundation\.md|scripts/(verify-one-heha-s1-review|verify-capture-query-read-only|verify-tracked-js-syntax)\.mjs|supabase/review_only/one_heha_s1/(000_minimal_baseline|001_private_identity|002_community_pass_foundation|003_transition_functions)\.sql|supabase/review_only/one_heha_s1/proof/(001_s1\.proof\.sql|concurrency_two_client\.sh)|supabase/review_only/one_heha_s1/rollback/001_s1\.rollback\.sql)$'

          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
            [[ "$file" =~ $allowed ]] || {
              echo "unexpected changed file: $file" >&2
              exit 1
            }
          done

          if printf '%s\n' "${files[@]}" | grep -E '^(src/|supabase/migrations/|supabase/functions/|\.env|package(-lock)?\.json$)' >/dev/null; then
            echo "application, standard migration, provider, environment, dependency or lockfile scope entered S1" >&2
            exit 1
          fi

      - name: Verify deterministic source contract
        run: node scripts/verify-one-heha-s1-review.mjs

      - name: Reject psql client meta-commands
        shell: bash
        run: |
          set -euo pipefail
          sql_files=(
            supabase/review_only/one_heha_s1/000_minimal_baseline.sql
            supabase/review_only/one_heha_s1/001_private_identity.sql
            supabase/review_only/one_heha_s1/002_community_pass_foundation.sql
            supabase/review_only/one_heha_s1/003_transition_functions.sql
            supabase/review_only/one_heha_s1/proof/001_s1.proof.sql
            supabase/review_only/one_heha_s1/rollback/001_s1.rollback.sql
          )
          if grep -nE '^[[:space:]]*\\' "${sql_files[@]}"; then
            echo 'psql client meta-commands are forbidden in S1 review SQL' >&2
            exit 1
          fi

      - name: Apply synthetic baseline
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/review_only/one_heha_s1/000_minimal_baseline.sql

      - name: Apply S1 review SQL
        run: |
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/review_only/one_heha_s1/001_private_identity.sql
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/review_only/one_heha_s1/002_community_pass_foundation.sql
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/review_only/one_heha_s1/003_transition_functions.sql

      - name: Prove exact-file reapply
        run: |
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/review_only/one_heha_s1/001_private_identity.sql
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/review_only/one_heha_s1/002_community_pass_foundation.sql
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/review_only/one_heha_s1/003_transition_functions.sql

      - name: Run structural and lifecycle proof
        run: |
          set -euo pipefail
          proof_output="$(mktemp)"
          trap 'rm -f "$proof_output"' EXIT
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -f supabase/review_only/one_heha_s1/proof/001_s1.proof.sql 2>&1 | tee "$proof_output"
          test "$(grep -Fc 'PASS: ONE HEHA S1 SQL proof verified 14/14 results' "$proof_output")" -eq 1

      - name: Run genuine two-client concurrency proof
        run: |
          chmod +x supabase/review_only/one_heha_s1/proof/concurrency_two_client.sh
          supabase/review_only/one_heha_s1/proof/concurrency_two_client.sh

      - name: Roll back disposable S1 objects
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/review_only/one_heha_s1/rollback/001_s1.rollback.sql

      - name: Verify clean teardown
        run: |
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          do $clean$
          begin
            if pg_catalog.to_regnamespace('one_heha_private') is not null
               or pg_catalog.to_regnamespace('community_pass_private') is not null
               or pg_catalog.to_regclass('public.community_pass_accounts') is not null
               or pg_catalog.to_regclass('public.community_pass_entitlements') is not null
               or pg_catalog.to_regclass('public.community_pass_stripe_event_inbox') is not null then
              raise exception 'S1 rollback left review objects behind';
            end if;
          end;
          $clean$;
          SQL

      - name: Reapply after rollback
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/review_only/one_heha_s1/001_private_identity.sql
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/review_only/one_heha_s1/002_community_pass_foundation.sql
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/review_only/one_heha_s1/003_transition_functions.sql
          proof_output="$(mktemp)"
          trap 'rm -f "$proof_output"' EXIT
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -f supabase/review_only/one_heha_s1/proof/001_s1.proof.sql 2>&1 | tee "$proof_output"
          test "$(grep -Fc 'PASS: ONE HEHA S1 SQL proof verified 14/14 results' "$proof_output")" -eq 1
