name: Partner Claim SQL Proof

on:
  push:
    branches:
      - claude/partner-claim-acl-proof-v2-maowfs
    paths:
      - .github/workflows/partner-claim-proof.yml
      - supabase/migrations/20260807160000_partner_claim_foundation_v2.sql
      - supabase/tests/**
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/partner-claim-proof.yml
      - supabase/migrations/20260807160000_partner_claim_foundation_v2.sql
      - supabase/tests/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  partner-claim-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4

      - name: Install Supabase CLI (pinned)
        uses: supabase/setup-cli@v1
        with:
          version: 2.112.0

      - name: Record executed revision and toolchain versions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/partner-claim-proof
          {
            echo "github_event=${{ github.event_name }}"
            echo "checked_out_sha=$(git rev-parse HEAD)"
            echo "github_sha=${{ github.sha }}"
            echo "pr_head_sha=${{ github.event.pull_request.head.sha }}"
            echo "pr_base_sha=${{ github.event.pull_request.base.sha }}"
          } | tee artifacts/partner-claim-proof/executed-revision.txt
          supabase --version 2>&1 | tee artifacts/partner-claim-proof/supabase-cli-version.txt

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql --version | tee -a artifacts/partner-claim-proof/supabase-cli-version.txt

      - name: Prepare isolated synthetic Supabase project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ci/partner-claim
          mkdir -p .ci/partner-claim
          cd .ci/partner-claim
          supabase init
          mkdir -p supabase/migrations
          cp ../../supabase/tests/fixtures/partner_claim_minimal_baseline.sql \
            supabase/migrations/20260807150000_partner_claim_minimal_baseline.sql
          cp ../../supabase/migrations/20260807160000_partner_claim_foundation_v2.sql \
            supabase/migrations/20260807160000_partner_claim_foundation_v2.sql

      - name: Start isolated Supabase stack and apply migrations
        shell: bash
        run: |
          set -euo pipefail
          cd .ci/partner-claim
          # Full startup output (which prints disposable local credentials) is
          # kept out of the uploaded evidence; only sanitized status evidence
          # is retained.
          if supabase start > supabase-start-full.log 2>&1; then
            start_status=started
          else
            start_status=failed
          fi
          grep -Ei 'supabase local development|started|stopped|error|warn' supabase-start-full.log \
            | grep -viE 'key|secret|token|jwt|password|url|s3' \
            > ../../artifacts/partner-claim-proof/supabase-start-sanitized.txt || true
          echo "supabase_start=$start_status" >> ../../artifacts/partner-claim-proof/supabase-start-sanitized.txt
          test "$start_status" = started

      - name: Run core, extended and ACL-matrix rollback proofs
        shell: bash
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail

          psql "$DATABASE_URL" \
            -v ON_ERROR_STOP=1 \
            -v partner_a_id=11111111-1111-4111-8111-111111111111 \
            -v partner_b_id=22222222-2222-4222-8222-222222222222 \
            -v user_a_id=aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa \
            -v user_b_id=bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb \
            -v internal_admin_user_id=cccccccc-cccc-4ccc-8ccc-cccccccccccc \
            -f supabase/tests/partner_claim_foundation_proof.sql \
            2>&1 | tee artifacts/partner-claim-proof/core-proof.txt

          psql "$DATABASE_URL" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/partner_claim_extended_proof.sql \
            2>&1 | tee artifacts/partner-claim-proof/extended-proof.txt

          psql "$DATABASE_URL" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/partner_claim_acl_matrix_proof.sql \
            2>&1 | tee artifacts/partner-claim-proof/acl-matrix-proof.txt

          psql "$DATABASE_URL" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/partner_claim_lifecycle_proof.sql \
            2>&1 | tee artifacts/partner-claim-proof/lifecycle-proof.txt

          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -X -A -F '|' -c "
            select 'claim_table_exists', (to_regclass('public.partner_claim_invites') is not null)::text
            union all
            select 'claim_rpc_exists', (to_regprocedure('public.claim_partner_profile(text)') is not null)::text
            union all
            select 'synthetic_partner_count', (select count(*)::text from public.partners where is_test_record = true);
          " > artifacts/partner-claim-proof/schema-evidence.txt

      - name: Prove corrective migration re-apply (idempotency)
        shell: bash
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20260807160000_partner_claim_foundation_v2.sql \
            2>&1 | tee artifacts/partner-claim-proof/idempotency-reapply.txt
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f supabase/tests/partner_claim_acl_matrix_proof.sql \
            > /dev/null
          echo "acl_matrix_proof_after_reapply=pass" \
            | tee -a artifacts/partner-claim-proof/idempotency-reapply.txt

      - name: Two-session concurrency proof (replace-vs-claim, revoke-vs-claim)
        shell: bash
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          bash supabase/tests/partner_claim_concurrency_proof.sh \
            2>&1 | tee artifacts/partner-claim-proof/concurrency-proof.txt

      - name: 'Negative control: evidence scan must detect seeded token material'
        shell: bash
        env:
          EVIDENCE_SCAN_PATTERN: (eyJ[A-Za-z0-9_-]{20,}|[0-9a-f]{64}|sb_secret_|sb_publishable_|service_role_key|anon[ _]key|secret[ _]key|access[ _]key)
        run: |
          set -euo pipefail
          # Prove the scan actually detects each class of forbidden material
          # before trusting its clean verdict on the real evidence. The seeds
          # live outside the artifact directory and are deleted afterwards.
          control_dir="$(mktemp -d)"
          printf 'synthetic raw token: %s\n' "$(printf 'ab%.0s' $(seq 1 32))" > "$control_dir/token.txt"
          printf 'synthetic jwt: eyJabcdefghijklmnopqrstuvwxyz012345\n' > "$control_dir/jwt.txt"
          printf 'service_role_key: synthetic\n' > "$control_dir/label.txt"
          for f in token.txt jwt.txt label.txt; do
            if ! grep -rInE "$EVIDENCE_SCAN_PATTERN" "$control_dir/$f" > /dev/null; then
              echo "Negative control FAILED: scan did not detect seeded $f"
              exit 1
            fi
          done
          rm -rf "$control_dir"
          echo 'Negative control passed: scan detects seeded token, JWT and key-label material.'

      - name: Scan evidence for raw tokens or credential material
        shell: bash
        env:
          EVIDENCE_SCAN_PATTERN: (eyJ[A-Za-z0-9_-]{20,}|[0-9a-f]{64}|sb_secret_|sb_publishable_|service_role_key|anon[ _]key|secret[ _]key|access[ _]key)
        run: |
          set -euo pipefail
          # Raw one-time claim tokens are 64 lowercase hex chars; local stack
          # credentials are JWT-shaped or key/secret-labelled. None may appear
          # in uploaded evidence.
          if grep -rInE "$EVIDENCE_SCAN_PATTERN" artifacts/partner-claim-proof; then
            echo 'Sensitive material found in proof evidence; failing.'
            exit 1
          fi
          echo 'Evidence scan clean: no raw tokens or credential material.'

      # Evidence content is uploaded only when every prior step — including the
      # scan — succeeded, so a scan failure can never publish the material it
      # rejected. always() is reserved for stack cleanup below.
      - name: Upload proof evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: partner-claim-proof-${{ github.sha }}
          path: artifacts/partner-claim-proof
          if-no-files-found: warn
          retention-days: 14

      # On any failure, publish only a content-free manifest (names, sizes,
      # SHA-256 digests) so the failed run stays diagnosable without shipping
      # evidence content that may not have passed the scan.
      - name: Build content-free failure manifest
        if: failure()
        shell: bash
        run: |
          mkdir -p artifacts/failure-manifest
          {
            echo "run_conclusion=failure"
            echo "checked_out_sha=$(git rev-parse HEAD 2>/dev/null || echo unknown)"
            if [ -d artifacts/partner-claim-proof ]; then
              (cd artifacts/partner-claim-proof && find . -type f -exec sh -c \
                'printf "%s %s bytes sha256=%s\n" "$1" "$(wc -c < "$1")" "$(sha256sum "$1" | cut -d" " -f1)"' _ {} \;)
            fi
          } > artifacts/failure-manifest/manifest.txt
          cat artifacts/failure-manifest/manifest.txt

      - name: Upload failure manifest
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: partner-claim-proof-failure-manifest-${{ github.sha }}
          path: artifacts/failure-manifest
          if-no-files-found: warn
          retention-days: 14

      - name: Stop and destroy isolated Supabase stack
        if: always()
        shell: bash
        run: |
          if [ -d .ci/partner-claim ]; then
            cd .ci/partner-claim
            supabase stop --no-backup || true
          fi
