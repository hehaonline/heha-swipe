name: iOS pull request validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: heha-swipe-ios-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-unsigned-ios:
    name: Verify unsigned iOS candidate
    runs-on: macos-26
    timeout-minutes: 30
    env:
      # Nonfunctional CI fixtures; no repository or environment secrets are used.
      VITE_RELEASE_CHANNEL: store
      VITE_SUPABASE_URL: https://ci-validation.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_ci_validation_only_00000000000000000000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Confirm Apple build toolchain
        run: xcodebuild -version

      - name: Install exact dependencies
        run: npm ci

      - name: Audit shipped dependencies
        run: npm audit --omit=dev

      - name: Verify store policy, contracts, and assets
        run: npm run test:store-release && npm run assets:check

      - name: Build and sync the store web bundle for iOS
        run: npm run build:store && npx cap sync ios

      - name: Build the unsigned iOS Simulator app
        run: >-
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/heha-swipe-derived-data"
          CODE_SIGNING_ALLOWED=NO
          build
