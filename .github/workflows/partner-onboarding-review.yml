                raise exception 'Partner-onboarding rollback did not restore legacy view %', v_view;
              end if;

              select pg_catalog.lower(pg_catalog.pg_get_viewdef(v_view::pg_catalog.regclass, true))
              into v_definition;

              if pg_catalog.strpos(v_definition, 'partners') = 0
                 or pg_catalog.strpos(v_definition, 'status') = 0
                 or pg_catalog.strpos(v_definition, 'approved') = 0
                 or pg_catalog.strpos(v_definition, 'live') = 0
                 or pg_catalog.strpos(v_definition, 'is_test_record') = 0
                 or pg_catalog.strpos(v_definition, 'partner_release_receipts') > 0
