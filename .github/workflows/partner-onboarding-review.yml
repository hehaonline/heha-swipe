              '92000000-0000-4000-8000-000000000096'::uuid,
              '92000000-0000-4000-8000-000000000097'::uuid,
              '92000000-0000-4000-8000-000000000098'::uuid,
              '92000000-0000-4000-8000-000000000099'::uuid
            ]
               or v_directory_ids is distinct from array[
                 '92000000-0000-4000-8000-000000000095'::uuid
