          do $clean$
          declare
            v_view text;
            v_definition text;
          begin
            if not exists (
              select 1
              from public.partners partner
              where partner.id = '92000000-0000-4000-8000-000000000099'
                and partner.name = 'HEHA Rollback Sentinel'
                and partner.status = 'approved'
                and partner.website_eligible is false
                and partner.swipe_eligible is false
                and partner.local_eligible is false
                and partner.is_test_record is false
            ) then
              raise exception 'Partner-onboarding rollback changed or removed the baseline sentinel';
            end if;

            if exists (
              select 1
              from public.partners partner
              where pg_catalog.lower(
                pg_catalog.regexp_replace(
                  pg_catalog.btrim(partner.name),
                  '[[:space:]]+',
                  ' ',
                  'g'
                )
              ) = 'synthetic concurrency business race'
            ) then
              raise exception 'Partner-onboarding rollback left a normalized business-race profile behind';
            end if;

            if pg_catalog.to_regnamespace('partner_onboarding_private') is not null
               or pg_catalog.to_regprocedure(
                 'partner_onboarding_private.epoch_release_receipt_id_v1(uuid)'
               ) is not null
               or pg_catalog.to_regprocedure(
                 'partner_onboarding_private.invalidate_release_after_partner_change_v1()'
               ) is not null
               or pg_catalog.to_regprocedure(
                 'partner_onboarding_private.list_pending_partner_applications_v1(uuid,integer)'
               ) is not null
               or pg_catalog.to_regprocedure(
                 'partner_onboarding_private.revoke_partner_agreement_acceptance_v1(uuid,uuid,text)'
               ) is not null
               or pg_catalog.to_regprocedure(
                 'partner_onboarding_private.bootstrap_staff_authority_v1(uuid,text)'
               ) is not null
               or pg_catalog.to_regprocedure(
                 'partner_onboarding_private.grant_staff_authority_v1(uuid,text,uuid)'
               ) is not null
               or pg_catalog.to_regprocedure(
                 'partner_onboarding_private.revoke_staff_authority_v1(uuid,uuid,text)'
               ) is not null
               or pg_catalog.to_regprocedure(
                 'partner_onboarding_private.require_active_staff_authority_v1(uuid,text)'
               ) is not null then
              raise exception 'Partner-onboarding rollback left a private schema helper behind';
            end if;

            if exists (
              select 1
              from pg_catalog.pg_trigger trigger
              join pg_catalog.pg_class relation on relation.oid = trigger.tgrelid
              join pg_catalog.pg_namespace namespace on namespace.oid = relation.relnamespace
              where namespace.nspname = 'public'
                and relation.relname = 'partners'
                and trigger.tgname = 'invalidate_partner_release_after_reviewed_change'
                and not trigger.tgisinternal
            ) then
              raise exception 'Partner-onboarding rollback left the profile invalidation trigger behind';
            end if;

            if pg_catalog.to_regclass('public.partner_public_cards_v1') is not null then
