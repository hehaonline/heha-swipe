            v_local_ids uuid[];
          begin
            select pg_catalog.array_agg(partner.id order by partner.id)
            into v_ids
            from public.partners partner
            where partner.id in (
              '92000000-0000-4000-8000-000000000095',
              '92000000-0000-4000-8000-000000000096',
              '92000000-0000-4000-8000-000000000097',
              '92000000-0000-4000-8000-000000000098',
              '92000000-0000-4000-8000-000000000099'
            );

            select pg_catalog.array_agg(id order by id) into v_directory_ids
            from public.public_partner_directory
            where id between '92000000-0000-4000-8000-000000000095'
              and '92000000-0000-4000-8000-000000000099';
            select pg_catalog.array_agg(id order by id) into v_swipe_ids
            from public.public_swipe_partners
            where id between '92000000-0000-4000-8000-000000000095'
              and '92000000-0000-4000-8000-000000000099';
            select pg_catalog.array_agg(id order by id) into v_local_ids
            from public.public_local_partners
            where id between '92000000-0000-4000-8000-000000000095'
              and '92000000-0000-4000-8000-000000000099';

            if v_ids is distinct from array[
