               or pg_catalog.has_table_privilege('anon', 'public.partners', 'UPDATE')
               or not pg_catalog.has_table_privilege('authenticated', 'public.partners', 'INSERT')
               or not pg_catalog.has_table_privilege('authenticated', 'public.partners', 'UPDATE')
               or pg_catalog.has_table_privilege('authenticated', 'public.partners', 'DELETE')
               or exists (
                 select 1
                 from pg_catalog.unnest(array['service_role', 'supabase_auth_admin']) role_name
                 cross join pg_catalog.unnest(array[
                   'SELECT', 'INSERT', 'UPDATE', 'DELETE',
                   'TRUNCATE', 'REFERENCES', 'TRIGGER'
                 ]) privilege_name
                 where pg_catalog.has_table_privilege(
                   role_name, 'public.partners', privilege_name
                 )
               )
               or not exists (
                 select 1
                 from pg_catalog.pg_class relation
                 join pg_catalog.pg_namespace namespace
                   on namespace.oid = relation.relnamespace
                 where namespace.nspname = 'public'
                   and relation.relname = 'partners'
                   and relation.relrowsecurity
                   and relation.relforcerowsecurity
               )
               or not exists (
                 select 1
                 from pg_catalog.pg_policy policy
                 join pg_catalog.pg_class relation on relation.oid = policy.polrelid
                 join pg_catalog.pg_namespace namespace on namespace.oid = relation.relnamespace
                 where namespace.nspname = 'public'
                   and relation.relname = 'partners'
                   and policy.polname = 'Synthetic legacy public status visibility'
                   and pg_catalog.strpos(
                     pg_catalog.lower(
                       pg_catalog.pg_get_expr(policy.polqual, policy.polrelid)
                     ),
                     'status'
                   ) > 0
                   and pg_catalog.strpos(
                     pg_catalog.lower(
                       pg_catalog.pg_get_expr(policy.polqual, policy.polrelid)
                     ),
                     'approved'
                   ) > 0
                   and pg_catalog.strpos(
                     pg_catalog.lower(
                       pg_catalog.pg_get_expr(policy.polqual, policy.polrelid)
                     ),
                     'live'
                   ) > 0
                   and pg_catalog.strpos(
                     pg_catalog.lower(
                       pg_catalog.pg_get_expr(policy.polqual, policy.polrelid)
                     ),
                     'is_test_record'
                   ) > 0
                   and (
                     pg_catalog.strpos(
                       pg_catalog.lower(
                         pg_catalog.pg_get_expr(policy.polqual, policy.polrelid)
                       ),
                       'false'
                     ) > 0
                     or pg_catalog.strpos(
