                   and (
                     select pg_catalog.array_agg(
                       pg_catalog.pg_get_userbyid(role_oid)::text
                       order by pg_catalog.pg_get_userbyid(role_oid)::text
                     )
                     from pg_catalog.unnest(policy.polroles) role_oid
                   ) = array['authenticated']::text[]
                   and pg_catalog.strpos(
                     pg_catalog.lower(
                       pg_catalog.pg_get_expr(policy.polqual, policy.polrelid)
                     ),
                     'owner_id'
                   ) > 0
                   and pg_catalog.strpos(
                     pg_catalog.lower(
                       pg_catalog.pg_get_expr(policy.polwithcheck, policy.polrelid)
                     ),
                     'pending'
                   ) > 0
               ) then
              raise exception 'Partner-onboarding rollback restored an unexpected partner policy inventory';
            end if;

            foreach v_view in array array[
              'public.public_partner_directory',
              'public.public_swipe_partners',
              'public.public_local_partners'
