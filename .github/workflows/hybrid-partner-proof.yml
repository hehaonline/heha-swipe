name: Hybrid Partner Lifecycle Proof

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/hybrid-partner-proof.yml
      - supabase/migrations/2026081109*.sql
      - supabase/migrations/20260817154529_hybrid_partner_security_reconciliation.sql
      - supabase/migrations/20260817154927_hybrid_partner_claim_recipient_contract.sql
      - supabase/tests/hybrid_partner_lifecycle_proof.sql
      - supabase/tests/fixtures/hybrid_partner_minimal_baseline.sql
      - scripts/hybrid_partner_concurrency_proof.sh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hybrid-partner-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull_request event normally checks out GitHub's synthetic merge
          # ref. The security evidence must instead come from the literal PR
          # head that reviewers can identify and reproduce.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install Supabase CLI (pinned)
        uses: supabase/setup-cli@v1
        with:
          version: 2.112.0

      - name: Install PostgreSQL client and pin the exact reviewed head
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y postgresql-client; fi
          mkdir -p artifacts/hybrid-partner-proof
          checked_out_sha="$(git rev-parse HEAD)"
          {
            echo "checked_out_sha=${checked_out_sha}"
            echo "github_sha=${GITHUB_SHA}"
            echo "pr_head_sha=${PR_HEAD_SHA}"
            echo "pr_base_sha=${PR_BASE_SHA}"
            echo "supabase_cli=$(supabase --version)"
            echo "psql=$(psql --version)"
          } | tee artifacts/hybrid-partner-proof/revision.txt
          # Fail closed unless the evidence was produced by the exact PR head.
          if [ -n "${PR_HEAD_SHA}" ]; then
            if [ "${checked_out_sha}" != "${PR_HEAD_SHA}" ]; then
              echo "exact_head_check=FAILED: checked out ${checked_out_sha}, expected ${PR_HEAD_SHA}" \
                | tee -a artifacts/hybrid-partner-proof/revision.txt
              exit 1
            fi
            echo "exact_head_check=pass" | tee -a artifacts/hybrid-partner-proof/revision.txt
          fi
          bash -n scripts/hybrid_partner_concurrency_proof.sh

      - name: Prepare disposable synthetic Supabase project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ci/hybrid-partner
          mkdir -p .ci/hybrid-partner
          cd .ci/hybrid-partner
          supabase init
          mkdir -p supabase/migrations
          cp ../../supabase/tests/fixtures/hybrid_partner_minimal_baseline.sql \
            supabase/migrations/20260811080000_hybrid_partner_minimal_baseline.sql
          cp ../../supabase/migrations/2026081109*.sql supabase/migrations/
          cp ../../supabase/migrations/20260817154529_hybrid_partner_security_reconciliation.sql \
            supabase/migrations/
          cp ../../supabase/migrations/20260817154927_hybrid_partner_claim_recipient_contract.sql \
            supabase/migrations/
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' \
            | sort | tee ../../artifacts/hybrid-partner-proof/migration-order.txt

      - name: Start disposable Supabase and apply migrations
        shell: bash
        run: |
          set -euo pipefail
          cd .ci/hybrid-partner
          if supabase start > supabase-start-full.log 2>&1; then status=started; else status=failed; fi
          grep -Ei 'started|stopped|error|warn|local development' supabase-start-full.log \
            | grep -viE 'key|secret|token|jwt|password|url|s3' \
            > ../../artifacts/hybrid-partner-proof/start-sanitized.txt || true
          echo "supabase_start=$status" >> ../../artifacts/hybrid-partner-proof/start-sanitized.txt
          test "$status" = started

      - name: Execute behavioral SQL proof
        shell: bash
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/hybrid_partner_lifecycle_proof.sql \
            2>&1 | tee artifacts/hybrid-partner-proof/behavioral-proof.txt

      # The numbered forward migration is ledger-applied once. The follow-up
      # corrective definitions are deliberately re-apply-safe and are replayed
      # here to prove their policies, functions, triggers and ACLs converge.
      #
      # Replay order is lexical and load-bearing: later corrective migrations
      # supersede earlier definitions of the same functions, so the last file to
      # touch a definition is the one that must win. The behavioral proof is
      # rerun afterwards to prove the converged state, not just that each file
      # replays without error.
      - name: Prove corrective migration re-apply and rerun behavioral proof
        shell: bash
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          : > artifacts/hybrid-partner-proof/corrective-idempotency-reapply.txt
          # Inject the exact pre-correction shape that can exist after the old
          # Auth SET NULL behavior: live evidence whose signer differs from the
          # immutable owner snapshot, with a signed partner pointing at it.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          alter table public.partner_agreement_acceptances
            drop constraint partner_agreement_acceptances_live_signer_check;
          insert into public.partner_agreement_versions(
            id,version,document_sha256,created_by
          ) values (
            '13131313-1313-4313-8313-131313131313',
            'LEGACY-SIGNER-MISMATCH',
            extensions.digest('legacy-signer-mismatch-version','sha256'),
            'dddddddd-dddd-4ddd-8ddd-dddddddddddd'
          );
          insert into public.partner_agreement_acceptances(
            id,partner_id,agreement_version_id,accepted_owner_id,accepted_by,
            signature_source,evidence_sha256
          ) values (
            '14141414-1414-4414-8414-141414141414',
            '33333333-3333-4333-8333-333333333333',
            '13131313-1313-4313-8313-131313131313',
            'bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb',
            'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',
            'recorded_offline',
            extensions.digest('legacy-signer-mismatch-acceptance','sha256')
          );
          select app_private.authorize_partner_lifecycle_mutation(
            '33333333-3333-4333-8333-333333333333','partnership_review'
          );
          update public.partners
          set partnership_status='official_partner',
              contract_status='signed',
              contract_evidence_id='14141414-1414-4414-8414-141414141414',
              contract_signed_at=now(),
              official_partner_since=now(),
              heha_partner=true
          where id='33333333-3333-4333-8333-333333333333';
          commit;
          SQL
          for migration in \
            supabase/migrations/20260811090[1-9]*.sql \
            supabase/migrations/20260817154529_hybrid_partner_security_reconciliation.sql \
            supabase/migrations/20260817154927_hybrid_partner_claim_recipient_contract.sql; do
            echo "reapply=$migration" | tee -a artifacts/hybrid-partner-proof/corrective-idempotency-reapply.txt
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration" \
              2>&1 | tee -a artifacts/hybrid-partner-proof/corrective-idempotency-reapply.txt
          done
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL' \
            2>&1 | tee -a artifacts/hybrid-partner-proof/corrective-idempotency-reapply.txt
          do $proof$
          begin
            assert (
              select partnership_status='under_review'
                and contract_status='not_signed'
                and contract_evidence_id is null
                and heha_partner=false
              from public.partners
              where id='33333333-3333-4333-8333-333333333333'
            ), 'legacy mismatched evidence did not unwind signed partner state';
            assert (
              select acceptance_status='terminated' and revoked_at is not null
              from public.partner_agreement_acceptances
              where id='14141414-1414-4414-8414-141414141414'
            ), 'legacy mismatched evidence did not become terminal';
            assert exists (
              select 1 from pg_constraint
              where conname='partner_agreement_acceptances_live_signer_check'
                and convalidated
            ), 'live signer-owner constraint is not validated';
          end;
          $proof$;
          SQL
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/hybrid_partner_lifecycle_proof.sql \
            > artifacts/hybrid-partner-proof/behavioral-proof-after-reapply.txt 2>&1
          echo 'behavioral_proof_after_corrective_reapply=pass' \
            | tee -a artifacts/hybrid-partner-proof/corrective-idempotency-reapply.txt

      - name: Execute genuine two-session concurrency proof
        shell: bash
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          bash scripts/hybrid_partner_concurrency_proof.sh \
            2>&1 | tee artifacts/hybrid-partner-proof/concurrency-proof.txt

      - name: Build application
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          git diff --check

      - name: Negative-control and evidence sensitivity scan
        shell: bash
        env:
          SCAN: (eyJ[A-Za-z0-9_-]{20,}|[0-9a-f]{64}|sb_secret_|sb_publishable_|service_role_key|anon[ _]key|secret[ _]key|access[ _]key)
        run: |
          set -euo pipefail
          d="$(mktemp -d)"
          printf 'synthetic token %s\n' "$(printf 'ab%.0s' $(seq 1 32))" > "$d/token.txt"
          grep -Eq "$SCAN" "$d/token.txt"
          rm -rf "$d"
          if grep -rInE "$SCAN" artifacts/hybrid-partner-proof; then
            echo 'Sensitive token/credential-shaped material found in evidence.'
            exit 1
          fi
          echo 'evidence_scan=clean' | tee artifacts/hybrid-partner-proof/evidence-scan.txt

      - name: Upload sanitized successful evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-partner-proof-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/hybrid-partner-proof
          retention-days: 14

      - name: Stop and destroy disposable Supabase
        if: always()
        shell: bash
        run: |
          if [ -d .ci/hybrid-partner ]; then cd .ci/hybrid-partner && supabase stop --no-backup || true; fi
